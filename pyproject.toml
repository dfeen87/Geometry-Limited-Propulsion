[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "geometry_limited_propulsion"
version = "0.1.0"
description = "HLV-AILEE coherence-gated propulsion model"
authors = [
    { name = "Don Feeney" }
]
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
